<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta
      name="description"
      content="GTA Suomi Nurmes 1 - mobiiliystävällinen minipeli, joka toimii puhelimella ja voidaan asentaa käyttöön."
    />
    <title>GTA Suomi Nurmes 1</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Mobiili mini-peli</p>
          <h1>GTA Suomi Nurmes 1</h1>
        </div>
        <button id="installBtn" class="install-btn hidden" type="button">Asenna puhelimeen</button>
      </header>

      <div class="hud" aria-live="polite">
        <div class="stat">
          <span class="label">Pisteet</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span class="label">Aika</span>
          <strong id="timer">60</strong>
        </div>
        <div class="stat">
          <span class="label">Kestot</span>
          <strong id="health">3</strong>
        </div>
      </div>

      <canvas id="gameCanvas" width="420" height="680" aria-label="Pelin näyttö"></canvas>

      <div class="controls" aria-label="Ohjauspainikkeet">
        <div class="control-row">
          <button type="button" data-dir="up">▲</button>
        </div>
        <div class="control-row middle">
          <button type="button" data-dir="left">◀</button>
          <button type="button" data-dir="down">▼</button>
          <button type="button" data-dir="right">▶</button>
        </div>
      </div>

      <div id="message" class="message" aria-live="polite">
        Kerää kaikki tähdet ja vältä poliisia.
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
